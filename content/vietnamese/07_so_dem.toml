title = "Số đếm"

[[items]]
type = "concept"
name = "một"
kind = "atom"
gloss = "one"
category = "numeral"
language = "vi"
description = "Số 1. Không có trong danh sách tần suất nào vì văn bản viết dùng chữ số, nên phải viết tay. Cũng dùng như 'một cái' — một thứ gì đó."

[[items]]
type = "concept"
name = "hai"
kind = "atom"
gloss = "two"
category = "numeral"
language = "vi"
description = "Số 2. Đi cùng loại từ khi đếm vật: 'hai con chó', không phải 'hai chó'."

[[items]]
type = "concept"
name = "ba"
kind = "atom"
gloss = "three"
category = "numeral"
language = "vi"
description = "Số 3. Cùng chữ này còn nghĩa là 'bố' ở miền Nam — ngữ cảnh phân biệt, không cần nói với người mới học."

[[items]]
type = "concept"
name = "bốn"
kind = "atom"
gloss = "four"
category = "numeral"
language = "vi"
description = "Số 4."

[[items]]
type = "concept"
name = "năm"
kind = "atom"
gloss = "five"
category = "numeral"
language = "vi"
description = "Số 5. Cũng nghĩa là 'năm' (đơn vị thời gian) — hai nghĩa, một chữ, rất hay gặp cả hai."

[[items]]
type = "concept"
name = "mười"
kind = "atom"
gloss = "ten"
category = "numeral"
language = "vi"
description = "Số 10. Từ 11 đến 19 ghép thẳng: 'mười một', 'mười hai'. Biết 1-10 là biết đếm tới 99 với vài quy tắc ghép."

[[items]]
type = "concept"
name = "mươi"
kind = "atom"
gloss = "ten, in twenty and above"
category = "numeral"
language = "vi"
description = "Từ chỉ hàng chục từ 20 trở lên: 'hai mươi' (20), 'ba mươi' (30). Khác 'mười' (10) đúng một dấu — mười có dấu huyền, mươi không có. Nghe thì gần như một, mà là hai từ. Khi nói nhanh người Việt bỏ luôn: 'năm mốt' thay vì 'năm mươi mốt' (51). Thanh ngang — giọng đều."

[[items]]
type = "concept"
name = "trăm"
kind = "atom"
gloss = "hundred"
category = "numeral"
language = "vi"
description = "Số 100: 'một trăm'. Đứng sau số đếm như mọi hàng: 'hai trăm' (200), 'ba trăm' (300). Thanh ngang — giọng đều."

[[items]]
type = "concept"
name = "nghìn"
kind = "atom"
gloss = "thousand"
category = "numeral"
language = "vi"
description = "Số 1000: 'một nghìn'. Trong Nam nói 'ngàn', ngoài Bắc nói 'nghìn', hai từ như nhau. Đây là hàng quan trọng nhất khi mua bán: giá tiền ở Việt Nam đếm bằng nghìn — 'hai mươi lăm nghìn' là 25 000 đồng. Thanh huyền — giọng xuống."

[[items]]
type = "concept"
name = "triệu"
kind = "atom"
gloss = "million"
category = "numeral"
language = "vi"
description = "Số 1 000 000: 'một triệu'. Cần thật, không phải để cho đủ: tiền thuê nhà, tiền học, tiền xe máy đều tính bằng triệu. 'Năm triệu' là 5 000 000. Thanh nặng — giọng nặng, ngắn."

[[items]]
type = "concept"
name = "mốt"
kind = "atom"
gloss = "one, as in twenty-one"
category = "numeral"
language = "vi"
description = "Chữ 'một' đổi thành 'mốt' khi đứng CUỐI từ 21 trở lên: 'hai mươi mốt' (21), 'ba mươi mốt' (31). Riêng 11 vẫn là 'mười một', không đổi. Thanh sắc — giọng lên."

[[items]]
type = "concept"
name = "lăm"
kind = "atom"
gloss = "five, as in twenty-five"
category = "numeral"
language = "vi"
description = "Chữ 'năm' đổi thành 'lăm' khi đứng CUỐI, kể cả ở 15: 'mười lăm' (15), 'hai mươi lăm' (25). Lý do rất thật: 'năm' còn nghĩa là năm tháng, nên 'mười năm năm' sẽ không ai hiểu là 15 năm. Thanh ngang — giọng đều."

[[items]]
type = "concept"
name = "tư"
kind = "atom"
gloss = "four, as in twenty-four"
category = "numeral"
language = "vi"
description = "Chữ 'bốn' có thể đổi thành 'tư' khi đứng CUỐI từ 24 trở lên: 'hai mươi tư' hoặc 'hai mươi bốn', cả hai đều đúng. Riêng 14 luôn là 'mười bốn'. Đây là chữ dễ nhất trong ba chữ đổi, vì không bắt buộc. Thanh ngang — giọng đều."

[[items]]
type = "procedure"
name = "ghép số: chữ số + đơn vị"
kind = "feature"
nature = "strand"
gloss = "numbers here are built, not memorised — you stack words you already know, so ten digits carry you far past a hundred with nothing new to learn"
category = "rules"
language = "vi"
description = "Sợi chỉ xuyên suốt, không bao giờ hết: mọi số trong tiếng Việt là các chữ đã biết xếp cạnh nhau — 'năm trăm nghìn' là ba chữ người học đã có. Đúng ở 11, đúng ở 100, đúng ở một triệu. Từng quy tắc cụ thể (11-19, từ 20, mười thành mươi, nghìn, triệu) là feature discrete riêng, dạy từng lát một."
pieces = ["mười", "mươi"]

[[items]]
type = "procedure"
name = "mười một đến mười chín: mười + chữ số"
kind = "feature"
nature = "discrete"
tier = 2
after = "mười"
gloss = "for eleven up to nineteen you say mười first and then the digit, in that order and with nothing added"
category = "rules"
language = "vi"
description = "Lát thứ nhất của sợi ghép số. Từ 11 đến 19 là 'mười' cộng chữ số — mười một, mười hai, mười ba. Không có chữ mới nào cả. Đây là lát dễ nhất, dạy trước khi đảo thứ tự ở 20."
pieces = ["mười"]

[[items]]
type = "procedure"
name = "hai mươi trở lên: chữ số + mươi + chữ số"
kind = "feature"
nature = "discrete"
tier = 2
after = "mươi"
gloss = "from twenty on, the order flips — the digit comes first, then mươi, then the last digit: hai mươi ba is twenty-three"
category = "rules"
language = "vi"
description = "Lát thứ hai. Từ 20 trở lên đảo lại: chữ số đứng trước, rồi 'mươi', rồi chữ số cuối — 'hai mươi ba' (23), 'chín mươi bảy' (97). Biết mười chữ số là đếm được tới 99 — không có chữ nào mới."
pieces = ["mươi", "hai", "ba"]

[[items]]
type = "procedure"
name = "mười thành mươi khi có số đứng trước"
kind = "feature"
nature = "discrete"
tier = 2
after = "mươi"
gloss = "ten on its own is mười, but put a number in front of it and it turns into mươi — one tone mark apart, and two different words"
category = "rules"
language = "vi"
description = "Lát thứ ba, chỗ bẫy. 10 là 'mười', nhưng 20 là 'hai MƯƠI'. Một dấu thanh, hai từ khác nhau. Đây là lỗi hay gặp nhất khi đếm, nên tách riêng thành một lát chứ không nhét vào quy tắc từ 20."
pieces = ["mười", "mươi"]

[[items]]
type = "procedure"
name = "nghìn: chữ số + nghìn"
kind = "feature"
nature = "discrete"
tier = 1
after = "nghìn"
gloss = "thousands stack exactly the same way — a digit and then nghìn, so mười nghìn is ten thousand, which is about what a coffee costs"
category = "rules"
language = "vi"
description = "Lát đầu của phần tiền, và là lát đáng giá nhất: giá cả ở Việt Nam đếm bằng nghìn. 'Mười nghìn' = 10 000, 'hai mươi lăm nghìn' = 25 000. Chỉ cần lát này là mua được một ly cà phê. Cách ghép y như số thường — chữ số rồi 'nghìn' — nên không có gì mới ngoài chỗ đặt."
pieces = ["nghìn", "mười"]

[[items]]
type = "procedure"
name = "nói giá: chỉ cần con số"
kind = "feature"
nature = "discrete"
tier = 1
gloss = "to say a price you stop at the number — mười nghìn and nothing after it, because the name of the currency is left out and everyone still understands"
category = "rules"
language = "vi"
description = "Quy tắc BỎ, không phải quy tắc thêm: người Việt nói giá rồi dừng, không nói tên tiền. '100k' nói là 'một trăm nghìn'. Vì vậy tên đơn vị tiền KHÔNG được dạy như một từ phải nói — người học chỉ cần nghe hiểu. Quyết định của Meo, 2026-08-17."
pieces = ["nghìn"]

[[items]]
type = "procedure"
name = "trăm nghìn: tờ tiền hay cầm"
kind = "feature"
nature = "discrete"
tier = 1
after = "trăm"
gloss = "the notes you actually hold are hundreds of thousands — một trăm nghìn, hai trăm nghìn, năm trăm nghìn"
category = "rules"
language = "vi"
description = "Tờ tiền Việt Nam lên tới 500 000, nên hàng trăm nghìn là hàng gặp mỗi ngày, không phải hàng lớn. Ghép vẫn như cũ: chữ số + 'trăm' + 'nghìn'. Nguồn: người bản ngữ, 2026-08-17 — 100k = 'một trăm nghìn', 200k = 'hai trăm nghìn', 500k = 'năm trăm nghìn'."
pieces = ["trăm", "nghìn", "một", "hai", "năm"]

[[items]]
type = "procedure"
name = "triệu: hàng của tiền thuê và tiền xe"
kind = "feature"
nature = "discrete"
tier = 2
after = "triệu"
gloss = "above a thousand thousands comes triệu, a million — một triệu, hai triệu, mười triệu"
category = "rules"
language = "vi"
description = "Trên hàng nghìn là 'triệu'. Nguồn: người bản ngữ, 2026-08-17 — 1 triệu = 'một triệu', 2 triệu = 'hai triệu', 10 triệu = 'mười triệu'. Tier 2 chứ không phải 1: mua bán hằng ngày dừng ở trăm nghìn, triệu là khi thuê nhà hay mua xe."
pieces = ["triệu", "một", "hai", "mười"]

[[items]]
type = "procedure"
name = "năm thành lăm khi đứng cuối"
kind = "feature"
nature = "discrete"
tier = 3
after = "lăm"
gloss = "năm becomes lăm at the end of a number, because năm also means year and mười năm năm would be unsayable"
category = "rules"
language = "vi"
description = "Quy tắc: 'năm' đổi thành 'lăm' khi đứng CUỐI một số — 'mười lăm' (15), 'hai mươi lăm' (25). Lý do rất thật: 'năm' còn nghĩa là năm tháng, nên 'mười năm năm' không ai hiểu được. 'một' và 'bốn' cũng đổi tên ở cuối, nhưng đó là chuyện khác, học sau."
pieces = ["lăm", "năm", "mười"]

[[items]]
type = "procedure"
name = "thanh sắc và thanh nặng: giọng lên nhanh và giọng nặng"
kind = "feature"
nature = "strand"
gloss = "two more tunes. One shoots up, like an English What??? — nước is one of those. The other is the lowest and the shortest, stopped in the throat, said with a really heavy voice — chị is one"
category = "rules"
language = "vi"
description = "Cặp thứ hai (23 và 8 từ có ghi chú). Sắc: 'starts at a lower pitch, hangs flat for just a moment, and then quickly rises' — so sánh tiếng Anh: 'What???'. Nặng là thanh thấp nhất và ngắn nhất, kết bằng tắc thanh hầu; KHÔNG có so sánh tiếng Anh nào trong các nguồn đã đọc, chỉ có 'say a word with a really heavy and low voice'. Đừng hứa sáu so sánh khi chỉ có năm."
pieces = ["nước", "chị"]

[[items]]
type = "concept"
name = "tuổi"
kind = "atom"
gloss = "years old"
category = "noun"
language = "vi"
description = "Danh từ chỉ tuổi. Đứng SAU con số, không có gì ở giữa: 'hai mươi tuổi' — không cần 'là', không cần 'năm'. Đây là chỗ con số vừa học trở thành câu nói được. Thanh hỏi — giọng võng xuống rồi lên."

[[items]]
type = "procedure"
name = "bao nhiêu tiền?"
kind = "construction"
gloss = "how much does it cost?"
pieces = ["bao nhiêu", "tiền"]
literal = "how much money?"
category = "construction"
language = "vi"
description = "Câu hỏi giá, dùng hai từ đã biết và không thêm gì. Trả lời bằng con số cộng 'nghìn': 'Hai mươi lăm nghìn.' Đây là câu mở ra mọi việc mua bán, và nó không cần động từ nào cả."

[[items]]
type = "procedure"
name = "số + [đồ uống]: hai cà phê"
kind = "construction"
gloss = "two coffees"
pieces = ["hai", "cà phê"]
literal = "two coffee"
category = "construction"
language = "vi"
description = "Đặt con số THẲNG trước đồ uống, không cần loại từ khi gọi món: 'hai cà phê', 'ba nước'. Ngắn hơn tiếng Anh, không có 'cups of'. Con số vừa học dùng được ngay ở đây với mọi món đã biết."

[[items]]
type = "procedure"
name = "Tôi ... tuổi"
kind = "construction"
gloss = "I am twenty years old"
pieces = ["tôi", "tuổi"]
literal = "I [number] years"
category = "construction"
language = "vi"
description = "Nói tuổi mình: chủ ngữ, con số, rồi 'tuổi'. 'Tôi hai mươi lăm tuổi.' KHÔNG có 'là' ở giữa — 'là' chỉ đứng trước danh từ, và đây là con số. Câu này trả lời câu hỏi tuổi, thứ quyết định chọn 'anh' hay 'em'."
