title = "Muốn, ăn, uống"

[[items]]
type = "concept"
name = "muốn"
kind = "atom"
gloss = "to want"
category = "verb"
language = "vi"
description = "Động từ: mong có hoặc mong làm điều gì. Thanh sắc — giọng lên. 'Tôi muốn...' Động từ tiếng Việt không bao giờ chia — mọi ngôi đều dùng nguyên một dạng."

[[items]]
type = "concept"
name = "ăn"
kind = "atom"
gloss = "to eat"
category = "verb"
language = "vi"
description = "Động từ: ăn, dùng bữa. Thanh ngang. 'Tôi muốn ăn.' Không chia: anh ăn, chị ăn, em ăn — cùng một chữ 'ăn'."

[[items]]
type = "concept"
name = "uống"
kind = "atom"
gloss = "to drink"
category = "verb"
language = "vi"
description = "Động từ: uống. Thanh sắc — giọng lên. 'Em muốn uống.'"

[[items]]
type = "procedure"
name = "động từ không chia"
kind = "rule"
after = "đã"
gloss = "verbs never change, whoever is doing the action"
category = "rules"
language = "vi"
description = "Quy tắc: động từ tiếng Việt giữ nguyên một hình thức duy nhất. 'Tôi ăn', 'bạn ăn', 'anh ấy ăn' — cùng một chữ 'ăn'. Không chia theo ngôi, không chia theo số. Đây là điều nên nói sớm với người mới học: nó xoá đi phần khó nhất của tiếng Pháp hay tiếng Tây Ban Nha."
pieces = ["muốn", "ăn"]

[[items]]
type = "concept"
name = "đã"
kind = "atom"
gloss = "did, in the past"
category = "verb"
language = "vi"
description = "Từ đánh dấu việc đã xong, đặt NGAY TRƯỚC động từ. 'Tôi ăn cơm' thành 'Tôi đã ăn cơm'. Không bắt buộc: người Việt bỏ nó suốt khi câu đã có 'hôm qua' hoặc khi ngữ cảnh đã rõ. Dạy nó vì người học không thể nói về quá khứ nếu không có nó."

[[items]]
type = "concept"
name = "rồi"
kind = "atom"
gloss = "already"
category = "verb"
language = "vi"
description = "Khác ba từ kia: 'rồi' đứng ở CUỐI câu, không đứng trước động từ. 'Tôi ăn cơm rồi' — tôi ăn xong rồi. Trong nói chuyện hằng ngày, 'rồi' gặp nhiều hơn 'đã' rất nhiều, nên nó đáng dạy sớm."

[[items]]
type = "concept"
name = "chưa"
kind = "atom"
gloss = "not yet"
category = "verb"
language = "vi"
description = "Hai việc, một chữ. Trước động từ: chưa làm — 'Tôi chưa ăn'. Cuối câu: thành câu hỏi — 'Bạn ăn chưa?' nghĩa là 'bạn ăn chưa?'. Cặp với 'rồi': hỏi bằng 'chưa', trả lời bằng 'rồi'."

[[items]]
type = "procedure"
name = "muốn + [động từ]"
kind = "construction"
gloss = "want ___"
pieces = ["muốn"]
literal = "want + [verb]"
category = "construction"
language = "vi"
description = "Khung diễn tả ý muốn: 'muốn' cộng thẳng một động từ khác, không cần gì ở giữa, không biến đổi gì. 'Tôi muốn ăn.' 'Anh muốn uống gì?' Dùng được với mọi từ xưng hô và mọi động từ đã biết."

[[items]]
type = "concept"
name = "cà phê"
kind = "atom"
gloss = "coffee"
hook = "Vietnam is the second biggest coffee grower in the world, and the word came straight from French — you will almost recognise it."
category = "noun"
language = "vi"
description = "Danh từ: đồ uống quen thuộc — mượn từ tiếng Pháp 'café', nghe là nhận ra ngay. 'Cà' thanh huyền, 'phê' thanh ngang. 'Tôi muốn uống cà phê.'"

[[items]]
type = "concept"
name = "nước"
kind = "atom"
gloss = "water"
category = "noun"
language = "vi"
description = "Danh từ: nước để uống. Thanh sắc — giọng lên, cuối chữ ngắt gọn. 'Chị muốn uống nước?'"

[[items]]
type = "concept"
name = "cơm"
kind = "atom"
gloss = "rice"
category = "noun"
language = "vi"
description = "Danh từ: cơm đã nấu chín — trung tâm bữa ăn của người Việt. Thanh ngang. 'Ăn cơm' nhiều khi nghĩa là ăn bữa chính nói chung, không chỉ riêng món cơm. 'Em muốn ăn cơm.'"

[[items]]
type = "procedure"
name = "phủ định: không + [động từ hoặc tính từ]"
kind = "rule"
gloss = "không in front of the action negates it, and in front of a describing word too — one word for both, where English has to switch between don't and am not"
category = "rules"
language = "vi"
description = "Quy tắc: đặt 'không' ngay trước động từ ĐỂ phủ định cả câu — 'Tôi không muốn ăn.', 'Anh không uống cà phê.' Và trước tính từ y hệt, không đổi gì cả: 'Em không mệt.', 'Cơm này không ngon.' Một chữ, một chỗ, cho cả hai loại từ — chỗ này tiếng Việt dễ hơn tiếng Anh rất nhiều, vì tiếng Anh phải đổi giữa 'don't' và 'am not'. Đây cũng là việc thứ hai của chữ 'không' đã biết: vừa trả lời một mình được, vừa phủ định được."

pieces = ["không", "muốn", "ăn"]

# Règles rattachées à ce fichier : elles arrivent après les mots
# qu'elles décrivent, jamais groupées en bloc de théorie.

[[items]]
type = "procedure"
name = "trật tự câu: chủ ngữ – động từ – tân ngữ"
kind = "rule"
gloss = "the word order is the same as English: who, does, what"
category = "rules"
language = "vi"
description = "Quy tắc: trật tự cơ bản giống tiếng Anh — 'Tôi uống cà phê' đúng thứ tự 'I drink coffee'. Đây là chỗ dựa an toàn cho người mới: khi chưa chắc, cứ xếp như tiếng Anh thì thường đúng."
pieces = ["tôi", "uống", "cà phê"]

[[items]]
type = "procedure"
name = "sở hữu: danh từ + của + người"
kind = "rule"
gloss = "của puts the owner LAST — cà phê của tôi, the coffee of me, the reverse of English"
category = "rules"
language = "vi"
description = "Quy tắc: cái được sở hữu đứng trước, người sở hữu đứng sau, nối bằng 'của'. 'Cà phê của tôi' — cà phê của tôi. Ngược thứ tự tiếng Anh 'my coffee'. Trong nói chuyện thân mật, 'của' hay được lược bỏ: 'tên tôi'."
pieces = ["của", "cà phê", "tôi"]

[[items]]
type = "procedure"
name = "đã: việc đã xong, đứng trước động từ"
kind = "rule"
after = "đã"
gloss = "đã goes right before the action to put it in the past, and you can drop it whenever the time is already clear"
category = "rules"
language = "vi"
description = "Quy tắc: đặt 'đã' NGAY TRƯỚC động từ để nói việc đã xong. 'Tôi ăn cơm' thành 'Tôi đã ăn cơm'. Và nó KHÔNG bắt buộc — khi câu đã có 'hôm qua', người Việt bỏ 'đã' đi. Chỗ này là cả hệ thống thì của tiếng Việt: một chỗ trống ngay trước động từ. 'đang' và 'sẽ' đã học cũng vào đúng chỗ đó, nhưng học từng cái một, không học ba cái cùng lúc."
pieces = ["đã", "ăn"]

[[items]]
type = "procedure"
name = "cũng đứng trước động từ"
kind = "rule"
gloss = "cũng means also, and it sits right before the action — never at the end the way English puts it"
category = "rules"
language = "vi"
description = "Quy tắc: 'cũng' đứng ngay trước động từ hoặc tính từ. 'Tôi cũng muốn ăn.' 'Cà phê cũng ngon.' Vị trí cố định, không đứng cuối câu như 'too' trong tiếng Anh."
pieces = ["cũng", "muốn"]

[[items]]
type = "procedure"
name = "rồi: việc đã xong"
kind = "rule"
after = "rồi"
gloss = "rồi on the END of a sentence says it is already done, and it is heard far more often than đã"
category = "rules"
language = "vi"
description = "Quy tắc: 'rồi' đặt cuối câu để nói việc đã hoàn tất. 'Tôi ăn rồi' — tôi ăn xong rồi. Rất hay dùng, thường thay hẳn cho 'đã'. Trong nói chuyện hằng ngày, 'rồi' gặp nhiều hơn 'đã' nhiều lần."
pieces = ["rồi", "ăn"]

[[items]]
type = "procedure"
name = "chưa: chưa xong, và cũng để hỏi"
kind = "rule"
after = "chưa"
gloss = "chưa before the action means not yet; the same chưa on the end turns the sentence into a question"
category = "rules"
language = "vi"
description = "Quy tắc: 'chưa' trước động từ nghĩa là chưa làm — 'Tôi chưa ăn.' Cũng chính 'chưa' đặt cuối câu thành câu hỏi — 'Bạn ăn chưa?' nghĩa là 'bạn ăn chưa?'. Hai việc, một chữ, giống hệt cách 'không' vừa phủ định vừa hỏi."
pieces = ["chưa", "ăn"]

[[items]]
type = "procedure"
name = "lược bỏ chủ ngữ khi đã rõ"
kind = "rule"
gloss = "when it's obvious who you mean, you just drop the word"
category = "rules"
language = "vi"
description = "Quy tắc: bỏ chủ ngữ khi ngữ cảnh đã rõ. Hỏi 'Bạn ăn chưa?' thì trả lời 'Ăn rồi' là đủ, không cần 'tôi'. Câu đầy đủ không sai, nhưng nghe cứng. Người mới học nên biết sớm để hiểu người bản xứ nói."
pieces = ["ăn", "rồi"]
