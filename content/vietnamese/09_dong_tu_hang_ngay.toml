title = "Động từ và tính từ hằng ngày"

[[items]]
type = "concept"
name = "mệt"
kind = "atom"
gloss = "tired"
category = "adjective"
language = "vi"
description = "Tính từ. 'Em mệt.' Không cần 'là' ở giữa — đây là mẫu câu C của mọi tính từ. Thanh nặng — giọng nặng, ngắt gọn."

[[items]]
type = "concept"
name = "đói"
kind = "atom"
gloss = "hungry"
category = "adjective"
language = "vi"
description = "Tính từ. 'Em đói.' Rất hay dùng, và ghép thẳng với 'muốn ăn'. Thanh sắc — giọng lên."

