title = "Chỗ, lý do, và trả lời cho tự nhiên"

[[items]]
type = "concept"
name = "con"
kind = "atom"
gloss = "one, for animals"
category = "function_word"
language = "vi"
description = "Loại từ dùng cho động vật, chen giữa số và danh từ: 'hai con chó', 'một con cá'. Cũng có nghĩa là đứa con. Quy tắc loại từ đã học nhắc đến chữ này — giờ mới có thật. Thanh ngang — giọng đều."

[[items]]
type = "concept"
name = "người"
kind = "atom"
gloss = "person"
category = "noun"
language = "vi"
description = "Vừa là danh từ 'người', vừa là loại từ dùng cho người: 'hai người bạn'. Một trong những danh từ hay dùng nhất. Thanh huyền — giọng xuống."

[[items]]
type = "concept"
name = "quả"
kind = "atom"
gloss = "one, for fruit"
category = "function_word"
language = "vi"
description = "Loại từ cho trái cây và vật tròn: 'hai quả chuối'. Trong Nam nói 'trái'. Thanh hỏi — giọng võng xuống rồi lên."

[[items]]
type = "concept"
name = "chiếc"
kind = "atom"
gloss = "one, for vehicles"
category = "function_word"
language = "vi"
description = "Loại từ cho xe cộ và vật lẻ: 'một chiếc xe'. Dùng khi nói về một cái riêng lẻ. Thanh sắc — giọng lên."

[[items]]
type = "concept"
name = "đừng"
kind = "atom"
gloss = "don't do it"
category = "verb"
language = "vi"
description = "Đặt trước động từ để CẤM hoặc can: 'Đừng đi.', 'Đừng lo.' Khác 'không' — 'không đi' là KHÔNG đi, còn 'đừng đi' là XIN ĐỪNG đi. Chỗ này người học lẫn rất nhiều: một chữ để kể, một chữ để ngăn. Thanh huyền — giọng xuống."

[[items]]
type = "concept"
name = "nhất"
kind = "atom"
gloss = "the most"
category = "function_word"
language = "vi"
description = "Đặt SAU tính từ để nói nhất: 'ngon nhất', 'đẹp nhất'. Cùng chỗ với 'hơn' đã học — 'hơn' để so hai thứ, 'nhất' để đứng đầu tất cả. Thanh sắc — giọng lên."

[[items]]
type = "concept"
name = "vì"
kind = "atom"
gloss = "because"
category = "function_word"
language = "vi"
description = "Từ nối lý do: 'Em không đi vì em mệt.' Mở ra việc GIẢI THÍCH, không chỉ kể. Thanh huyền — giọng xuống."

[[items]]
type = "concept"
name = "còn"
kind = "atom"
gloss = "and what about"
category = "function_word"
language = "vi"
description = "Chuyển lượt nói: 'Em khoẻ. Còn anh?' Đây là chữ giữ cho câu chuyện qua lại, không để người kia im. Thanh huyền — giọng xuống."

[[items]]
type = "concept"
name = "nữa"
kind = "atom"
gloss = "more, again"
category = "function_word"
language = "vi"
description = "Đặt cuối câu: 'Một cái nữa.', 'Nói lại nữa đi.' Cũng dùng để xin thêm khi ăn uống. Thanh ngã — giọng gãy."

[[items]]
type = "concept"
name = "trong"
kind = "atom"
gloss = "inside"
category = "function_word"
language = "vi"
description = "Chỉ nơi chốn: ở phía trong. 'Trong nhà.' Đi cùng 'ở': 'Em ở trong nhà.' Thanh ngang — giọng đều."

[[items]]
type = "concept"
name = "trên"
kind = "atom"
gloss = "on top of"
category = "function_word"
language = "vi"
description = "Chỉ nơi chốn: ở phía trên. 'Trên bàn.' Thanh ngang — giọng đều."

[[items]]
type = "concept"
name = "dưới"
kind = "atom"
gloss = "underneath"
category = "function_word"
language = "vi"
description = "Chỉ nơi chốn: ở phía dưới. 'Dưới ghế.' Thanh sắc — giọng lên."

[[items]]
type = "concept"
name = "với"
kind = "atom"
gloss = "with"
category = "function_word"
language = "vi"
description = "Đi cùng ai: 'Em đi với anh.' Rất hay dùng, và ghép thẳng với mọi từ xưng hô đã học. Thanh sắc — giọng lên."

[[items]]
type = "concept"
name = "vâng"
kind = "atom"
gloss = "yes, politely"
category = "function_word"
language = "vi"
description = "Tiếng thưa vâng ngoài Bắc, giống 'dạ' trong Nam đã học. Dùng để đáp lại người lớn tuổi hơn. Thanh ngang — giọng đều."

[[items]]
type = "concept"
name = "xin lỗi"
kind = "atom"
gloss = "sorry"
category = "verb"
language = "vi"
description = "Câu xin lỗi, và cũng là cách mở lời với người lạ: 'Xin lỗi, cho hỏi...' Dùng chữ 'xin' đã biết. Thanh ngã — giọng gãy."

[[items]]
type = "concept"
name = "không sao"
kind = "atom"
gloss = "no problem"
category = "verb"
language = "vi"
description = "Câu đáp lại lời xin lỗi hoặc lời cảm ơn: 'Không sao.' Nghĩa đen là không có chuyện gì. Dùng hai chữ đã biết. Thanh ngang — giọng đều."

[[items]]
type = "procedure"
name = "trả lời: lặp lại động từ"
kind = "feature"
nature = "discrete"
tier = 1
after = "không"
gloss = "a yes-or-no question is answered with the verb itself, not with a word for yes — muốn, or không muốn"
category = "rules"
language = "vi"
description = "Quy tắc: câu hỏi 'có...không?' KHÔNG trả lời bằng một chữ 'vâng' hay 'có' riêng — trả lời bằng chính động từ trong câu hỏi. 'Bạn có muốn ăn không?' → 'Muốn.' hoặc 'Không muốn.' 'Anh có đi không?' → 'Đi.' Đây là phản xạ lộ người mới học nhanh nhất: ai trả lời 'yes' kiểu tiếng Anh là nghe ra ngay. Và nó dễ hơn, vì không phải nhớ chữ nào mới cả."
pieces = ["có", "không", "muốn"]

[[items]]
type = "procedure"
name = "nơi chốn: ở"
kind = "feature"
nature = "discrete"
tier = 2
after = "ở"
gloss = "ở marks a PLACE, and it is neither of the other two: English says is for a name, for a description and for a place alike, Vietnamese uses a different word each time"
category = "rules"
language = "vi"
description = "Quy tắc: 'ở' đánh dấu nơi chốn. 'Em ở Hà Nội.' Đây là mảnh thứ ba của cùng một chuyện: tiếng Anh dùng một chữ 'is' cho cả ba, tiếng Việt dùng ba cách khác nhau — 'là' trước một cái TÊN hay danh từ, KHÔNG CÓ GÌ trước tính từ, và 'ở' trước một NƠI CHỐN. Hai mảnh đầu đã học rồi; đây là cái cuối. Nói cả ba cạnh nhau một lần, rồi chỉ luyện cái này. Sau này 'trong', 'trên', 'dưới' sẽ nói rõ phía nào, nhưng đó là chuyện khác."
pieces = ["ở", "đâu"]
[[items]]
type = "concept"
name = "sẽ"
kind = "atom"
gloss = "will"
category = "verb"
language = "vi"
description = "Từ đánh dấu tương lai, đặt NGAY TRƯỚC động từ. 'Tôi sẽ ăn cơm'. Cũng không bắt buộc — 'ngày mai' một mình là đủ. Ba từ đã/đang/sẽ chiếm cùng một chỗ, đó là điều dễ nhất trong hệ thống thì của tiếng Việt."


[[items]]
type = "procedure"
name = "sẽ: việc sắp tới, đứng trước động từ"
kind = "feature"
nature = "discrete"
tier = 2
after = "sẽ"
gloss = "sẽ before the action puts it in the future, in the same slot as đã and đang, and it is just as optional"
category = "rules"
language = "vi"
description = "Quy tắc: đặt 'sẽ' NGAY TRƯỚC động từ để nói việc sắp tới. 'Tôi sẽ ăn cơm'. Vẫn cùng một chỗ trống với 'đã' và 'đang' — chỗ thứ ba và cuối cùng, không có gì mới ngoài chữ. Và như hai cái kia, không bắt buộc: 'ngày mai' một mình là đủ."
pieces = ["sẽ", "ăn"]
