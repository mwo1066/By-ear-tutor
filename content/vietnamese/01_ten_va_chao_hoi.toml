title = "Tên và chào hỏi"

[[items]]
type = "concept"
name = "tôi"
kind = "atom"
gloss = "I or me"
category = "function_word"
language = "vi"
description = "Đại từ ngôi thứ nhất, trung lập và luôn đúng ngữ pháp. Thanh ngang — giọng đều, không lên không xuống. Lưu ý: 'tôi' hơi trang trọng và xa cách; trong nói chuyện thân mật, người Việt thường xưng hô theo vai vế gia đình thay vì 'tôi'. Dùng 'tôi' khi mới học, khi trang trọng, hoặc khi chưa biết xưng hô thế nào cho đúng."

[[items]]
type = "procedure"
name = "xưng hô thay đổi theo người đối diện"
kind = "feature"
nature = "strand"
gloss = "Vietnamese swaps the word for 'I' depending on who you are talking to — you will meet those soon, and tôi is always safe in the meantime"
category = "rules"
language = "vi"
description = "Quy tắc à dire TÔT, ngay sau 'tôi'. Người học vừa nhận 'tôi' như thể nó tương đương với 'I' trong tiếng Anh — nó không phải. Tiếng Việt đổi từ xưng hô theo quan hệ giữa hai người nói: cùng một người vừa là 'anh', vừa là 'em', tuỳ đối diện là ai. KHÔNG dạy bảng chọn ở đây — các từ đó chưa được dạy. Chỉ nói ba điều: điều này tồn tại, các từ sẽ đến sớm, và 'tôi' không bao giờ sai trong lúc chờ. Mục đích là để người học không xây thói quen 'tôi = I' rồi phải défaire sau."
pieces = ["tôi", "anh"]

[[items]]
type = "concept"
name = "tên"
kind = "atom"
gloss = "name"
category = "noun"
language = "vi"
description = "Danh từ: tên gọi của một người. Thanh ngang. Ghép thẳng với đại từ đã biết: 'tên tôi' — tên của mình. Dùng khi giới thiệu và làm quen."

[[items]]
type = "concept"
name = "là"
kind = "atom"
gloss = "to be"
category = "verb"
language = "vi"
description = "Động từ nối để nói A là B, ví dụ khi giới thiệu tên. Thanh huyền — giọng xuống nhẹ. Chỉ đứng trước danh từ: 'Tôi là Nam.'"

[[items]]
type = "procedure"
name = "tôi tên là + [tên riêng]"
kind = "construction"
gloss = "My name is ___"
pieces = ["tôi", "tên", "là"]
literal = "I name is [name]"
category = "construction"
language = "vi"
description = "Khung câu giới thiệu tên: 'tôi tên là' cộng tên riêng của mình. 'Tôi tên là Nam.' Ghép từ ba từ đã biết: tôi, tên, là — câu hoàn chỉnh đầu tiên."

[[items]]
type = "concept"
name = "anh"
kind = "atom"
gloss = "address for an older male"
category = "function_word"
language = "vi"
description = "Từ xưng hô với đàn ông bằng tuổi hoặc hơn tuổi mình một chút — nghĩa gốc là 'anh trai'. Thanh ngang. Dùng cho cả người nói lẫn người nghe tùy vai: người lớn tuổi hơn tự xưng 'anh'; người nghe lớn tuổi hơn được gọi là 'anh'. 'Chào anh! Anh tên là gì?'"

[[items]]
type = "concept"
name = "chị"
kind = "atom"
gloss = "address for an older female"
category = "function_word"
language = "vi"
description = "Từ xưng hô với phụ nữ bằng tuổi hoặc hơn tuổi mình một chút — nghĩa gốc là 'chị gái'. Thanh nặng — thấp, ngắt gọn. 'Chào chị! Chị tên là gì?'"

[[items]]
type = "concept"
name = "em"
kind = "atom"
gloss = "address for a younger person"
category = "function_word"
language = "vi"
description = "Từ xưng hô với người ít tuổi hơn mình, nam hay nữ đều được — nghĩa gốc là 'em'. Thanh ngang. Người ít tuổi tự xưng 'em' khi nói với anh, chị. 'Chào em! Em tên là gì?'"

[[items]]
type = "procedure"
name = "cách chọn từ xưng hô"
kind = "feature"
nature = "strand"
gloss = "you have been saying tôi for I, and Vietnamese people hardly ever say it in real life; which word you use depends on who is in front of you, so with Minh — the Vietnamese voice, a man older than you — you are em and he is anh, while your tutor is a woman and would never be anh; keep tôi for strangers, for formal moments, and whenever you are not sure"
category = "rules"
language = "vi"
description = "Quy tắc chọn từ xưng hô theo tuổi và giới tính của người đối diện so với mình. Cùng một người có thể là 'anh' với người này và 'em' với người kia — xưng hô đổi theo từng cặp người nói chuyện. Người mới học chọn sai không ai giận, nhưng chọn đúng nghe ấm và tự nhiên hơn nhiều so với 'tôi' — 'tôi' đúng ngữ pháp nhưng lạnh."
steps = ["đàn ông hơn tuổi mình → anh", "phụ nữ hơn tuổi mình → chị", "người ít tuổi hơn mình → em", "chưa chắc, hoặc trang trọng → bạn / tôi"]
pieces = ["anh", "chị", "em"]

[[items]]
type = "concept"
name = "bạn"
kind = "atom"
gloss = "you"
category = "function_word"
language = "vi"
description = "Đại từ ngôi thứ hai trung lập — nghĩa gốc là 'người bạn'. Thanh nặng — giọng thấp, ngắn, ngắt gọn. An toàn khi chưa biết tuổi người đối diện, hay dùng giữa người trẻ cùng lứa. 'Bạn' và 'tôi' là cặp trung lập để bắt đầu."

[[items]]
type = "concept"
name = "gì"
kind = "atom"
gloss = "what thing"
category = "function_word"
language = "vi"
description = "Từ để hỏi, nghĩa là 'cái gì'. Thanh huyền. Đứng ở CUỐI câu hỏi, không đảo lên đầu câu: '... gì?'"

[[items]]
type = "procedure"
name = "bạn tên là gì?"
kind = "construction"
gloss = "What is your name?"
pieces = ["bạn", "tên", "là", "gì"]
literal = "you name is what"
category = "construction"
language = "vi"
description = "Câu hỏi tên: 'Bạn tên là gì?' Từ hỏi 'gì' nằm cuối câu. Trả lời bằng khung đã biết: 'Tôi tên là Nam.' Toàn bộ từ trong câu đều đã học."

[[items]]
type = "concept"
name = "chào"
kind = "atom"
gloss = "hello"
category = "function_word"
language = "vi"
description = "Lời chào — dùng cả khi gặp nhau và khi tạm biệt. Thanh huyền — giọng xuống. Nói 'chào' một mình hơi cộc; tự nhiên hơn khi ghép với đại từ: 'Chào bạn!' Dạng lịch sự, trang trọng hơn: 'Xin chào.'"

# Règles rattachées à ce fichier : elles arrivent après les mots
# qu'elles décrivent, jamais groupées en bloc de théorie.

[[items]]
type = "procedure"
name = "không có giống, không có mạo từ"
kind = "feature"
nature = "discrete"
tier = 3
gloss = "no genders, and no word for 'a' or 'the'"
category = "rules"
language = "vi"
description = "Quy tắc: danh từ không có giống đực/cái, và không có mạo từ. 'Cà phê' vừa là 'coffee', vừa là 'a coffee', vừa là 'the coffee' — ngữ cảnh quyết định. Người học tiếng Pháp thường mất nhiều tháng cho phần này; ở đây không có gì để học."
pieces = ["cà phê", "nước"]

[[items]]
type = "procedure"
name = "từ để hỏi đứng nguyên chỗ"
kind = "feature"
nature = "discrete"
tier = 3
gloss = "a question word like gì stays exactly where the answer would go, so nothing moves in the sentence"
category = "rules"
language = "vi"
description = "Quy tắc: từ để hỏi giữ đúng vị trí của câu trả lời, không nhảy lên đầu câu như tiếng Anh. 'Bạn tên là gì?' — chữ 'gì' đứng đúng chỗ mà cái tên sẽ đứng. 'Bạn ăn gì?' cũng vậy. Người học tiếng Anh hay muốn đảo lên đầu; không cần."
pieces = ["gì", "tên"]

[[items]]
type = "procedure"
name = "danh từ không đổi khi nhiều"
kind = "feature"
nature = "discrete"
tier = 3
gloss = "words don't change in the plural — you add a word instead"
category = "rules"
language = "vi"
description = "Quy tắc: danh từ giữ nguyên dù một hay nhiều. Muốn nói rõ số nhiều thì thêm 'các' (tất cả, toàn bộ) hoặc 'những' (một số trong đó) đứng trước. Không có đuôi '-s' như tiếng Anh."
pieces = ["các", "người"]

[[items]]
type = "procedure"
name = "loại từ: số + loại từ + danh từ"
kind = "feature"
nature = "discrete"
tier = 2
gloss = "counting needs a helper between the number and the thing: con for animals, cái for objects, người for people"
category = "rules"
language = "vi"
description = "Quy tắc: khi đếm, chen một loại từ vào giữa số và danh từ. 'Hai con chó' — hai + con + chó. Loại từ chọn theo loại vật: 'con' cho động vật, 'cái' cho đồ vật, 'người' cho người. Người mới học dùng sai loại từ vẫn được hiểu, nên đừng để nó chặn việc nói."
pieces = ["hai", "cái", "con", "người"]

[[items]]
type = "procedure"
name = "được đứng sau động từ: làm được"
kind = "feature"
nature = "discrete"
tier = 3
gloss = "được means you managed it, and unlike every other helper it goes AFTER the action, not before"
category = "rules"
language = "vi"
description = "Quy tắc: 'được' đứng SAU động từ để nói làm được, có khả năng. 'Tôi nói được tiếng Việt.' Khác tiếng Anh, nơi 'can' đứng trước. 'Được' cũng đứng một mình để nói 'ok, được thôi'."
pieces = ["được", "nói"]

[[items]]
type = "procedure"
name = "ạ: một chữ làm câu lịch sự"
kind = "feature"
nature = "discrete"
tier = 2
gloss = "ạ on the end of anything makes it polite — one syllable, no other change, and Vietnamese people notice it at once"
category = "rules"
language = "vi"
description = "Quy tắc: thêm 'ạ' ở cuối câu khi nói với người lớn tuổi hoặc trong hoàn cảnh trang trọng. 'Chào anh ạ.' 'Cảm ơn ạ.' Không đổi nghĩa, chỉ đổi thái độ — và người Việt để ý điều này ngay."
pieces = ["ạ", "cảm ơn"]

[[items]]
type = "procedure"
name = "thanh điệu: nghe và bắt chước"
kind = "feature"
nature = "strand"
gloss = "the same sounds said at a different pitch are different words — so copy the pitch, not just the sounds"
category = "rules"
language = "vi"
description = "Quy tắc duy nhất về thanh điệu trong khoá học chỉ bằng giọng nói. Tiếng Việt dùng độ cao giọng để phân biệt từ: cùng một chuỗi âm, đổi độ cao là đổi hẳn nghĩa. Người học KHÔNG nhìn thấy chữ viết ở đây, nên đừng mô tả dấu — sáu cái dấu chỉ có ích khi có chữ trước mắt. Điều cần nói: khi nghe Minh, nghe cả độ cao, không chỉ các âm. Không bao giờ nhận xét về thanh điệu của người học: tuteur không nghe được họ."
pieces = ["tôi", "là"]
