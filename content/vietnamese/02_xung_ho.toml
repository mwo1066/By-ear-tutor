title = "Xưng hô: anh, chị, em"

[[items]]
type = "concept"
name = "cảm ơn"
kind = "atom"
gloss = "thank you"
category = "function_word"
language = "vi"
description = "Lời cám ơn. 'Cảm' thanh hỏi — giọng xuống rồi vòng lên; 'ơn' thanh ngang. Tự nhiên nhất khi ghép với từ xưng hô: 'Cảm ơn anh!', 'Cảm ơn chị!', 'Cảm ơn em!'"

[[items]]
type = "concept"
name = "không"
kind = "atom"
gloss = "no / not"
category = "function_word"
language = "vi"
description = "Từ phủ định cơ bản nhất — dùng một mình để trả lời: 'Không.' Thanh ngang, giọng đều."

[[items]]
type = "procedure"
name = "không phải là + [danh từ]"
kind = "construction"
gloss = "I am not a ___"
pieces = ["không", "là"]
literal = "not right is [noun]"
category = "construction"
language = "vi"
description = "Khung phủ định của 'là': thêm 'không phải' vào trước. 'Tôi không phải là Nam.' 'Em không phải là Linh.' Dùng 'không' đã biết, cộng 'phải' — cặp 'không phải' luôn đi liền nhau trước 'là'."

# Règles rattachées à ce fichier : elles arrivent après les mots
# qu'elles décrivent, jamais groupées en bloc de théorie.

[[items]]
type = "procedure"
name = "xưng hô đổi theo từng cặp người nói"
kind = "feature"
nature = "strand"
gloss = "the word you use for 'you' changes with who you're talking to"
category = "rules"
language = "vi"
description = "Quy tắc: từ xưng hô không cố định theo người, mà theo QUAN HỆ giữa hai người đang nói. Cùng một người vừa là 'anh' với người ít tuổi hơn, vừa là 'em' với người lớn tuổi hơn. Đây là điều lạ nhất với người châu Âu: 'I' và 'you' trong tiếng Việt thay đổi liên tục trong cùng một ngày."
pieces = ["anh", "chị", "em"]
