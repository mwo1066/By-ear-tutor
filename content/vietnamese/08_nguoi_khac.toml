title = "Nói về người khác, và làm được việc"

[[items]]
type = "concept"
name = "ấy"
kind = "atom"
gloss = "that one"
category = "function_word"
language = "vi"
description = "Đặt SAU từ xưng hô để nói VỀ người đó thay vì nói VỚI họ: 'anh ấy' = anh ta, 'chị ấy' = chị ta. Không có nó thì cả khoá học chỉ nói được 'tôi' và 'bạn' — không kể được chuyện về ai. Thanh sắc — giọng lên."

[[items]]
type = "concept"
name = "ơi"
kind = "atom"
gloss = "hey, when you call someone"
category = "function_word"
language = "vi"
description = "Đặt SAU từ xưng hô để gọi ai đó: 'Anh ơi!', 'Chị ơi!'. Đây là cách gọi người phục vụ, người bán hàng, người quen ở xa. Không có nó thì không gọi được ai. Thanh ngang — giọng đều, không lên không xuống."

[[items]]
type = "concept"
name = "phải"
kind = "atom"
gloss = "must, have to"
category = "verb"
language = "vi"
description = "Đứng TRƯỚC động từ. 'Em phải đi.' Cùng chỗ với 'muốn' và 'cần', nên dạy liền sau chúng. Thanh hỏi — giọng võng xuống rồi lên."

[[items]]
type = "concept"
name = "có thể"
kind = "atom"
gloss = "to be able to"
category = "verb"
language = "vi"
description = "Đứng TRƯỚC động từ: 'Em có thể đi.' Khác 'được', đứng sau động từ. Hai cách nói 'có thể' với hai vị trí ngược nhau — chỗ người học hay lẫn. Thanh sắc — giọng lên. Thanh hỏi — giọng võng xuống rồi lên."

[[items]]
type = "concept"
name = "nên"
kind = "atom"
gloss = "should"
category = "verb"
language = "vi"
description = "Đứng TRƯỚC động từ. 'Anh nên ngủ.' Nhẹ hơn 'phải', dùng để khuyên. Thanh ngang — giọng đều, không lên không xuống."

[[items]]
type = "concept"
name = "cô"
kind = "atom"
gloss = "a woman your parents' age"
category = "function_word"
language = "vi"
description = "Từ xưng hô với phụ nữ trạc tuổi cha mẹ mình, hoặc cô giáo. Mình tự xưng là 'cháu'. Thanh ngang — giọng đều, không lên không xuống."

[[items]]
type = "concept"
name = "chú"
kind = "atom"
gloss = "a man your parents' age"
category = "function_word"
language = "vi"
description = "Từ xưng hô với đàn ông trạc tuổi cha mẹ mình. Mình tự xưng là 'cháu'. Thanh sắc — giọng lên."

[[items]]
type = "concept"
name = "ông"
kind = "atom"
gloss = "an elderly man"
category = "function_word"
language = "vi"
description = "Nghĩa gốc là 'ông nội/ngoại'. Dùng với người rất lớn tuổi, hoặc trang trọng. Mình xưng 'cháu'. Thanh ngang — giọng đều, không lên không xuống."

[[items]]
type = "concept"
name = "bà"
kind = "atom"
gloss = "an elderly woman"
category = "function_word"
language = "vi"
description = "Nghĩa gốc là 'bà nội/ngoại'. Dùng với phụ nữ rất lớn tuổi. Mình xưng 'cháu'. Thanh huyền — giọng xuống."

[[items]]
type = "concept"
name = "cháu"
kind = "atom"
gloss = "nephew or niece"
category = "function_word"
language = "vi"
description = "Tự xưng khi nói với cô, chú, bác, ông, bà. Cặp với tất cả các từ đó. Thanh sắc — giọng lên."

[[items]]
type = "concept"
name = "mình"
kind = "atom"
gloss = "me, softly"
category = "function_word"
language = "vi"
description = "Tự xưng thân mật giữa bạn bè cùng tuổi, mềm hơn 'tôi' rất nhiều. Thanh huyền — giọng xuống."

[[items]]
type = "procedure"
name = "nói VỀ ai đó: xưng hô + ấy"
kind = "feature"
nature = "discrete"
tier = 1
after = "ấy"
gloss = "ấy after a person-word turns speaking TO someone into speaking ABOUT them — anh, then anh ấy"
category = "rules"
language = "vi"
description = "Quy tắc mở ra ngôi thứ ba. 'Anh ấy' = anh ta, 'chị ấy' = chị ta, 'cô ấy' = cô ta. Cùng những từ xưng hô đã học, thêm 'ấy' là chuyển từ NÓI VỚI sang NÓI VỀ. Trước quy tắc này, người học chỉ nói được về mình và người đối diện."
pieces = ["ấy", "anh", "chị"]

[[items]]
type = "procedure"
name = "gọi ai đó: xưng hô + ơi"
kind = "feature"
nature = "discrete"
tier = 1
after = "ơi"
gloss = "ơi after a person-word calls out to them — it is how you get a waiter's attention across a room"
category = "rules"
language = "vi"
description = "Quy tắc gọi người. 'Anh ơi!', 'Chị ơi!' — gọi người phục vụ, người bán hàng, người ở xa. Cùng cấu trúc với 'ấy' nhưng khác việc: 'ấy' để nói về, 'ơi' để gọi."
pieces = ["ơi", "anh", "chị"]

[[items]]
type = "procedure"
name = "phải: bắt buộc, đứng trước động từ"
kind = "feature"
nature = "discrete"
tier = 2
after = "phải"
gloss = "phải before the action means you have to, and it takes the same slot as muốn and cần"
category = "rules"
language = "vi"
description = "Quy tắc: 'phải' đứng NGAY TRƯỚC động từ. 'Em phải đi.' Cùng chỗ với 'muốn' và 'cần' đã học — cùng một chỗ trống, chỉ đổi chữ. 'có thể' và 'nên' cũng vào chỗ đó, nhưng từng cái một. Điều đáng nhớ riêng: 'được' thì ngược lại, đứng SAU động từ."
pieces = ["phải", "đi"]
[[items]]
type = "concept"
name = "đang"
kind = "atom"
gloss = "in the middle of doing"
category = "verb"
language = "vi"
description = "Từ đánh dấu việc đang diễn ra, đặt NGAY TRƯỚC động từ. 'Tôi đang ăn cơm' — tôi đang ăn ngay lúc này. Cùng vị trí với 'đã' và 'sẽ', nên dạy ba cái liền nhau: chỉ chữ ở giữa đổi."


[[items]]
type = "procedure"
name = "đang: việc đang diễn ra, đứng trước động từ"
kind = "feature"
nature = "discrete"
tier = 2
after = "đang"
gloss = "đang before the action means right now, in the middle of it — the same slot đã uses"
category = "rules"
language = "vi"
description = "Quy tắc: đặt 'đang' NGAY TRƯỚC động từ để nói việc đang xảy ra lúc này. 'Tôi ăn cơm' thành 'Tôi đang ăn cơm'. Đúng cái chỗ trống mà 'đã' đã dùng — không phải chỗ mới, chỉ đổi chữ. Biết một chỗ là biết cả ba."
pieces = ["đang", "ăn"]

[[items]]
type = "concept"
name = "chúng tôi"
kind = "atom"
gloss = "we, not counting you"
category = "function_word"
language = "vi"
description = "Số nhiều LOẠI TRỪ người nghe: 'chúng tôi' là tôi và những người khác, KHÔNG có bạn. Từ điển: 'we/us (exclusive); compare chúng ta (including you)'. Tiếng Anh và tiếng Pháp không phân biệt điều này, nên đây là chỗ người học phải CHỌN. Dạy như MỘT từ trọn vẹn: 'chúng' đứng riêng mang sắc thái coi thường, nên không dạy tách ra (quyết định của Meo, 2026-08-17)."

[[items]]
type = "concept"
name = "chúng ta"
kind = "atom"
gloss = "we, counting you"
category = "function_word"
language = "vi"
description = "Số nhiều BAO GỒM người nghe: 'chúng ta đi' nghĩa là cả bạn cùng đi. Từ điển: 'we/us (inclusive); compare chúng tôi (not including you)'. Đây là từ dùng khi rủ ai đó."

[[items]]
type = "concept"
name = "họ"
kind = "atom"
gloss = "someone you do not know"
category = "function_word"
language = "vi"
description = "KHÔNG phải chỉ là 'they'. Người bản ngữ (2026-08-17): dùng 'họ' khi nói VỀ một người hoặc nhiều người mà mình không quen, hoặc không muốn nói rõ tuổi và giới tính. Vì vậy 'họ' dùng được cho MỘT người, không bắt buộc số nhiều — đây là chỗ bản dịch tiếng Anh 'they' làm hiểu sai. Từ điển cũng ghi 'towards people whom the speaker feels neutral about'. Đây là cách TRÁNH phải chọn từ xưng hô khi chưa đủ thông tin — công cụ rất hữu ích cho người mới học."

[[items]]
type = "procedure"
name = "chúng tôi hay chúng ta: có bạn trong đó không?"
kind = "feature"
nature = "discrete"
tier = 1
after = "chúng ta"
gloss = "there is no neutral we — chúng tôi leaves the person you are talking to out, chúng ta puts them in, and you must pick one"
category = "rules"
language = "vi"
description = "Tiếng Việt buộc phải chọn: 'chúng tôi' KHÔNG gồm người nghe, 'chúng ta' CÓ gồm người nghe. 'Chúng ta đi' là rủ; 'chúng tôi đi' là thông báo. Tiếng Anh và tiếng Pháp gộp cả hai vào một chữ, nên người học sẽ quên mất là có một lựa chọn phải làm. Đây không phải quy tắc về số nhiều mà về việc người nghe có ở trong nhóm hay không."
pieces = ["chúng tôi", "chúng ta"]

[[items]]
type = "procedure"
name = "các + bất kỳ từ xưng hô nào"
kind = "feature"
nature = "discrete"
tier = 1
after = "các"
gloss = "các in front of an address word makes it plural, and like the singular it swings three ways — các cháu is we to an elderly person, you to a group of children, and them when you speak about either"
category = "rules"
language = "vi"
description = "Người bản ngữ (2026-08-17): 'các anh' dùng được cho CHÚNG TÔI, CÁC BẠN và HỌ — giống hệt số ít, hướng nào là do ngữ cảnh quyết định, không phải do từ. Ví dụ của cô ấy: 'Các cháu không thích ăn cái này' — nói với một người lớn tuổi, 'các cháu' ở đây nghĩa là CHÚNG TÔI, tôi và bạn bè tôi. Đây chính là quy tắc cặp đôi áp dụng cho số nhiều. Người bản ngữ nhấn mạnh (2026-08-17): 'các' liên kết được với TẤT CẢ các từ xưng hô, nên phải dạy nó như một công cụ mở, không phải một ví dụ lẻ. Học một từ là có số nhiều của cả hệ thống: các anh, các chị, các em, các bạn, các cháu, các cô, các chú. Không có ngoại lệ nào cần nhớ. Đây là lý do 'các' đáng một quy tắc riêng chứ không chỉ một dòng trong quy tắc số nhiều."
pieces = ["các", "bạn"]
steps = ["anh → các anh", "chị → các chị", "em → các em", "bạn → các bạn", "cháu → các cháu"]
