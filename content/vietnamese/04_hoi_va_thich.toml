title = "Hỏi và thích"

[[items]]
type = "concept"
name = "có"
kind = "atom"
gloss = "have"
category = "verb"
language = "vi"
description = "Động từ: sở hữu hoặc tồn tại. Thanh sắc — giọng lên. 'Tôi có cà phê.' 'Chị có nước.'"

[[items]]
type = "procedure"
name = "câu hỏi có/không: có + [động từ] ... không?"
kind = "construction"
gloss = "do ... not?"
pieces = ["có", "không"]
literal = "do + [verb] ... not?"
category = "construction"
language = "vi"
description = "Khung câu hỏi có/không: đặt 'có' trước động từ và 'không' ở cuối câu. 'Bạn có muốn ăn không?' 'Chị có uống cà phê không?' Trả lời không cần chữ 'vâng' hay 'có' riêng — lặp lại chính động từ: 'Muốn.' hoặc 'Không muốn.' Toàn bộ bằng từ đã biết."

[[items]]
type = "concept"
name = "thích"
kind = "atom"
gloss = "like"
category = "verb"
language = "vi"
description = "Động từ: thấy hay, thấy ngon, thấy hợp với mình. Thanh sắc — giọng lên, cuối chữ ngắt gọn. 'Tôi thích cà phê.' 'Em có thích cơm không?'"

[[items]]
type = "concept"
name = "và"
kind = "atom"
gloss = "and"
category = "function_word"
language = "vi"
description = "Từ nối: ghép hai thứ với nhau. Thanh huyền — giọng xuống nhẹ. 'Cà phê và nước.' 'Tôi thích ăn và uống.'"

[[items]]
type = "concept"
name = "này"
kind = "atom"
gloss = "this"
category = "function_word"
language = "vi"
description = "Từ chỉ định, nghĩa 'này/cái này' — và luôn đứng SAU danh từ, không đứng trước như tiếng Anh: 'cơm này', 'cà phê này'. Thanh huyền. 'Tôi thích cơm này.'"

[[items]]
type = "concept"
name = "ngon"
kind = "atom"
gloss = "delicious"
category = "adjective"
language = "vi"
description = "Tính từ: món ăn hay đồ uống làm mình thấy thích. Thanh ngang. 'Cơm này ngon!' Đứng thẳng sau danh từ hay sau chủ ngữ, không cần thêm gì ở giữa."

[[items]]
type = "procedure"
name = "tính từ không cần 'là'"
kind = "rule"
gloss = "in front of a describing word, là disappears: cơm ngon, never cơm là ngon. It only stays in front of a name or a thing, the way you already say tôi tên là Nam"
after = "ngon"
pieces = ["ngon", "cơm"]
category = "rules"
language = "vi"
description = "Quy tắc: bắt đầu từ chỗ người học ĐÃ dùng 'là': 'Tôi tên là Nam' — 'là' đứng trước một cái TÊN, một danh từ. Còn với tính từ thì bỏ hẳn: 'Cơm ngon' đúng, 'cơm là ngon' sai. Đừng nói là họ hay quên — họ chưa từng dùng sai, khoá học chưa dạy kiểu đó. Nói cái đã biết trước, rồi cái mới: 'là' cho danh từ, không có gì cho tính từ."

# Règles rattachées à ce fichier : elles arrivent après les mots
# qu'elles décrivent, jamais groupées en bloc de théorie.

[[items]]
type = "procedure"
name = "tính từ đứng sau danh từ"
kind = "rule"
gloss = "the describing word comes after the thing, not before"
category = "rules"
language = "vi"
description = "Quy tắc: tính từ đi SAU danh từ. 'Cà phê ngon' — cà phê ngon, không phải 'ngon cà phê'. Ngược hẳn tiếng Anh. Đây là một trong hai chỗ mà trật tự khác tiếng Anh, nên nói rõ một lần rồi cho luyện ngay."
pieces = ["cà phê", "ngon"]

[[items]]
type = "procedure"
name = "câu hỏi có/không"
kind = "rule"
gloss = "có at the front and không at the end wrap any statement into a yes-or-no question — no inversion, no extra verb"
category = "rules"
language = "vi"
description = "Quy tắc: đặt 'có' trước động từ và 'không' ở cuối câu. 'Bạn có muốn ăn không?' Không đảo trật tự câu như tiếng Anh, không thêm trợ động từ. Trả lời: 'có' hoặc 'không' — đúng hai chữ vừa dùng."
pieces = ["có", "không"]

[[items]]
type = "procedure"
name = "rất trước, lắm sau"
kind = "rule"
gloss = "two words for very: rất goes before the describing word, lắm goes after it"
category = "rules"
language = "vi"
description = "Quy tắc: 'rất' đứng TRƯỚC tính từ, 'lắm' đứng SAU. 'Rất ngon' và 'ngon lắm' cùng nghĩa; 'ngon lắm' nghe thân mật và thường gặp hơn trong nói chuyện. Đừng dùng cả hai một lúc."
pieces = ["rất", "lắm", "ngon"]

[[items]]
type = "procedure"
name = "so sánh: tính từ + hơn"
kind = "rule"
gloss = "hơn after a describing word is how you compare — ngon hơn, better tasting"
category = "rules"
language = "vi"
description = "Quy tắc: thêm 'hơn' ngay sau tính từ. 'Cà phê ngon hơn' — ngon hơn. Không đổi hình thức tính từ như 'good → better'. Muốn nói hơn cái gì thì đặt cái đó sau: 'ngon hơn nước'."
pieces = ["hơn", "ngon"]

[[items]]
type = "concept"
name = "hiểu"
kind = "atom"
gloss = "to understand"
category = "verb"
language = "vi"
description = "Động từ. 'Tôi không hiểu' là câu sống còn của người mới học — nói được câu đó là đã mở được cuộc nói chuyện thay vì bỏ chạy. Dạy sớm, ngay sau 'không'."

[[items]]
type = "concept"
name = "biết"
kind = "atom"
gloss = "to know"
category = "verb"
language = "vi"
description = "Động từ. Cặp với 'hiểu': 'tôi không biết' khi thiếu thông tin, 'tôi không hiểu' khi không nghe kịp. Cũng dùng cho khả năng: 'tôi biết nói tiếng Việt'."

[[items]]
type = "concept"
name = "nói"
kind = "atom"
gloss = "to speak"
category = "verb"
language = "vi"
description = "Động từ. Mở ra câu hỏi quan trọng nhất khi đi du lịch: hỏi người đối diện có nói được tiếng của mình không. Đi cùng tên ngôn ngữ: 'nói tiếng Anh'."

[[items]]
type = "concept"
name = "ở"
kind = "atom"
gloss = "at, in"
category = "function_word"
language = "vi"
description = "Giới từ chỉ nơi chốn, đứng trước địa điểm. 'Tôi ở Hà Nội.' Ghép thẳng với 'đâu' thành câu hỏi hay dùng nhất khi đi lại: '... ở đâu?'."

[[items]]
type = "concept"
name = "đâu"
kind = "atom"
gloss = "what place"
category = "function_word"
language = "vi"
description = "Từ để hỏi nơi chốn, đứng ở CUỐI câu như mọi từ để hỏi khác. 'Khách sạn ở đâu?' Đây là câu hỏi mà người đi du lịch dùng nhiều nhất."

[[items]]
type = "concept"
name = "bao nhiêu"
kind = "atom"
gloss = "how much"
category = "function_word"
language = "vi"
description = "Từ để hỏi số lượng hoặc giá, đứng cuối câu. 'Cái này bao nhiêu?' Không có nó thì không mua được gì — nên nó đi trước cả các con số."

[[items]]
type = "concept"
name = "được"
kind = "atom"
gloss = "can, okay"
category = "verb"
language = "vi"
description = "Đứng SAU động từ để nói làm được: 'tôi nói được'. Đứng một mình nghĩa là 'được thôi, ok'. Rất hay gặp, và vị trí sau động từ là chỗ người học hay đặt sai vì tiếng Anh đặt 'can' ở trước."

[[items]]
type = "concept"
name = "ai"
kind = "atom"
gloss = "what person"
category = "function_word"
language = "vi"
description = "Từ để hỏi người, đứng đúng chỗ của câu trả lời. 'Ai ăn cơm?' hoặc 'Bạn là ai?'. Cùng họ với 'gì' và 'đâu'."

[[items]]
type = "concept"
name = "rất"
kind = "atom"
gloss = "very"
category = "function_word"
language = "vi"
description = "Đứng TRƯỚC tính từ. 'Rất ngon.' Có một cách khác là 'lắm' đứng sau — 'ngon lắm' — nghe thân mật hơn và hay gặp hơn trong nói chuyện."

[[items]]
type = "concept"
name = "nhưng"
kind = "atom"
gloss = "but"
category = "function_word"
language = "vi"
description = "Liên từ nối hai câu, đứng giữa. Cùng với 'và', đây là hai từ cho phép nói một câu dài hơn một ý — bước đầu để không chỉ trả lời bằng từng mẩu."

[[items]]
type = "concept"
name = "cần"
kind = "atom"
gloss = "to need"
category = "verb"
language = "vi"
description = "Động từ, dùng giống 'muốn' nhưng mạnh hơn và ít khách sáo hơn khi nhờ vả. 'Tôi cần...' Ghép thẳng với danh từ hoặc động từ."

[[items]]
type = "concept"
name = "tiền"
kind = "atom"
gloss = "money"
category = "noun"
language = "vi"
description = "Danh từ. Đi cùng 'bao nhiêu' cho mọi việc mua bán. Người mới học cần nó trước hầu hết danh từ khác vì nó xuất hiện trong mọi cuộc trao đổi ngoài đường."

[[items]]
type = "concept"
name = "của"
kind = "atom"
gloss = "belonging to"
category = "function_word"
language = "vi"
description = "Nối vật với người sở hữu, và người sở hữu đứng SAU: 'cà phê của tôi'. Ngược thứ tự tiếng Anh. Trong nói chuyện thân mật hay được lược bỏ: 'tên tôi'."

[[items]]
type = "concept"
name = "cũng"
kind = "atom"
gloss = "also"
category = "function_word"
language = "vi"
description = "Đứng NGAY TRƯỚC động từ hoặc tính từ, không đứng cuối câu như 'too' trong tiếng Anh. 'Tôi cũng muốn ăn.'"

[[items]]
type = "concept"
name = "hơn"
kind = "atom"
gloss = "more than"
category = "function_word"
language = "vi"
description = "Đứng NGAY SAU tính từ để so sánh: 'ngon hơn'. Tính từ không đổi hình thức như 'good → better'."

[[items]]
type = "concept"
name = "lắm"
kind = "atom"
gloss = "a lot, very"
category = "function_word"
language = "vi"
description = "Đứng SAU tính từ: 'ngon lắm'. Cùng nghĩa với 'rất' đứng trước, nhưng nghe thân mật hơn và gặp nhiều hơn khi nói. Không dùng cả hai một lúc."

[[items]]
type = "concept"
name = "cái"
kind = "atom"
gloss = "one, for objects"
category = "function_word"
language = "vi"
description = "Loại từ dùng cho đồ vật, chen giữa số và danh từ: 'hai cái bàn'. Với động vật thì dùng 'con'. Người mới học chọn sai loại từ vẫn được hiểu — đừng để nó chặn việc nói."

[[items]]
type = "concept"
name = "các"
kind = "atom"
gloss = "the plural marker"
category = "function_word"
language = "vi"
description = "Đặt TRƯỚC danh từ để chỉ số nhiều: 'các bạn'. Danh từ tự nó không đổi. 'Những' cũng làm việc này nhưng chỉ một phần trong nhóm."

[[items]]
type = "concept"
name = "ạ"
kind = "atom"
gloss = "politely"
category = "function_word"
language = "vi"
description = "Thêm ở CUỐI câu khi nói với người lớn tuổi hoặc trong hoàn cảnh trang trọng. 'Cảm ơn ạ.' Không đổi nghĩa, chỉ đổi thái độ — và người Việt để ý ngay."

[[items]]
type = "concept"
name = "cho"
kind = "atom"
gloss = "to give"
category = "verb"
language = "vi"
description = "Động từ 'đưa cho'. Mở ra cấu trúc xin đồ quan trọng nhất khi đi du lịch: 'cho tôi...' — đưa tôi. Lịch sự hơn nếu thêm 'ạ' ở cuối."

[[items]]
type = "concept"
name = "hôm nay"
kind = "atom"
gloss = "today"
category = "noun"
language = "vi"
description = "Từ chỉ thời gian. Quan trọng vì tiếng Việt bỏ 'đã/sẽ' khi trong câu đã có từ chỉ thời gian — nên biết những từ này là điều kiện để bỏ được các từ kia."

[[items]]
type = "concept"
name = "ngày mai"
kind = "atom"
gloss = "tomorrow"
category = "noun"
language = "vi"
description = "Từ chỉ thời gian tương lai. 'Ngày mai tôi ăn' đủ rõ, không cần 'sẽ'."

[[items]]
type = "concept"
name = "hôm qua"
kind = "atom"
gloss = "yesterday"
category = "noun"
language = "vi"
description = "Từ chỉ thời gian quá khứ. 'Hôm qua tôi ăn' đủ rõ, không cần 'đã'."

[[items]]
type = "concept"
name = "sáu"
kind = "atom"
gloss = "six"
category = "numeral"
language = "vi"
description = "Số 6."

[[items]]
type = "concept"
name = "bảy"
kind = "atom"
gloss = "seven"
category = "numeral"
language = "vi"
description = "Số 7."

[[items]]
type = "concept"
name = "tám"
kind = "atom"
gloss = "eight"
category = "numeral"
language = "vi"
description = "Số 8."

[[items]]
type = "concept"
name = "chín"
kind = "atom"
gloss = "nine"
category = "numeral"
language = "vi"
description = "Số 9. Cũng nghĩa là 'chín' (đồ ăn đã nấu xong) — hai nghĩa, một chữ."

[[items]]
type = "concept"
name = "dạ"
kind = "atom"
gloss = "yes, respectfully"
category = "function_word"
language = "vi"
description = "Đặt ở ĐẦU câu. Không hẳn là 'vâng': nó là tiếng đáp lễ phép, dùng với người lớn tuổi, người lạ, người phục vụ, thầy cô — và dùng rộng hơn 'yes' trong tiếng Anh rất nhiều. Người nước ngoài nói được 'dạ' đúng lúc là nghe khác hẳn ngay lập tức."

[[items]]
type = "concept"
name = "xin"
kind = "atom"
gloss = "please, may I"
category = "verb"
language = "vi"
description = "Nghĩa gốc là 'xin phép', dùng như 'please'. Ghép với 'cho' thành lời xin đồ lịch sự: 'xin cho tôi...'. Cũng nằm trong 'xin chào' và 'xin lỗi' mà người học đã biết."

[[items]]
type = "concept"
name = "sao"
kind = "atom"
gloss = "for what reason"
category = "function_word"
language = "vi"
description = "Từ để hỏi lý do. Như mọi từ để hỏi, nó đứng đúng chỗ của câu trả lời, không nhảy lên đầu câu: 'Sao bạn không ăn?'"

[[items]]
type = "concept"
name = "thế nào"
kind = "atom"
gloss = "in what way"
category = "function_word"
language = "vi"
description = "Từ để hỏi cách thức, đứng ở CUỐI câu: 'Cái này thế nào?'. Hoàn thiện bộ từ để hỏi mà người học đã có: gì, đâu, ai, bao nhiêu, sao."

[[items]]
type = "procedure"
name = "lịch sự nằm trong từ xưng hô, không phải trong giọng"
kind = "rule"
gloss = "politeness here is not a tone of voice — it is the person-word you pick, plus two small words"
category = "rules"
language = "vi"
description = "Quy tắc buộc lại ba thứ đã học rời rạc. Trong tiếng Anh, lịch sự nằm ở giọng và ở 'please'. Trong tiếng Việt nó nằm ở CHỖ KHÁC: chọn đúng từ xưng hô đã là lịch sự rồi — đó là phần lớn công việc. Còn lại chỉ hai chữ nhỏ: 'dạ' ở đầu, 'ạ' ở cuối. Người học đã có cả ba mảnh; đây là lúc nói rằng chúng là một hệ thống."
pieces = ["anh", "chị", "em", "dạ", "ạ"]
